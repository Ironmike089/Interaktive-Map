<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medipulse | Interaktive Weltkarte</title>
<link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Medipulse</span>
      <span class="brand-sub">Interaktive Ärzte-Weltkarte</span>
    </div>

    <div class="stats" id="stats">
      <div class="stat"><span class="stat-value" id="stat-total">0</span><span class="stat-label">Ärzte gesamt</span></div>
      <div class="stat status-kunde"><span class="stat-value" id="stat-kunde">0</span><span class="stat-label">Kunden</span></div>
      <div class="stat status-interessent"><span class="stat-value" id="stat-interessent">0</span><span class="stat-label">Interessenten</span></div>
      <div class="stat status-lead"><span class="stat-value" id="stat-lead">0</span><span class="stat-label">Leads</span></div>
    </div>

    <img src="assets/medipulse-logo.png" alt="Medipulse" class="topbar-logo" id="topbar-logo" onerror="this.style.display='none'">
    <button id="settings-toggle" class="icon-btn" title="Einstellungen">⚙️</button>
    <button id="sidebar-toggle" class="icon-btn" title="Liste ein-/ausblenden">☰</button>
  </header>

  <div class="settings-panel" id="settings-panel" hidden>
    <div class="settings-panel-header">
      <span>Einstellungen</span>
      <button id="settings-close" class="icon-btn" title="Schließen">×</button>
    </div>

    <div class="settings-row">
      <span class="settings-label">Automatische Rotation</span>
      <label class="switch">
        <input type="checkbox" id="settings-rotate-toggle" checked>
        <span class="switch-slider"></span>
      </label>
    </div>

    <div class="settings-divider"></div>

    <div class="gpa-block">
      <div class="gpa-title">GPA</div>
      <div class="gpa-sub">Gewinn pro Arzt</div>
      <input type="range" id="gpa-slider" class="gpa-slider" min="0" max="300" step="5" value="50">
      <div class="gpa-input-row">
        <input type="number" id="gpa-input" class="gpa-input" min="0" max="2000" step="5" value="50">
        <span class="gpa-unit">€ / Arzt</span>
      </div>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <input type="text" id="search" placeholder="Suche nach Name, Stadt, Fachrichtung…" />
      </div>

      <div class="sidebar-section filters">
        <div class="filter-group-label">
          <button type="button" class="chevron-btn" data-target="status-body" aria-expanded="true"><span class="chevron"></span></button>
          <span class="filter-group-title">Status</span>
        </div>
        <div class="filter-group-body" id="status-body">
          <label class="chip chip-kunde"><input type="checkbox" data-status="kunde" checked> Kunde</label>
          <label class="chip chip-interessent"><input type="checkbox" data-status="interessent" checked> Interessent</label>
          <label class="chip chip-lead"><input type="checkbox" data-status="lead" checked> Lead</label>
          <label class="chip chip-inaktiv"><input type="checkbox" data-status="inaktiv" checked> Inaktiv</label>
        </div>
      </div>

      <div class="sidebar-section filters kategorie-filters">
        <div class="filter-group-label">
          <button type="button" class="chevron-btn" data-target="kategorie-body" aria-expanded="true"><span class="chevron"></span></button>
          <span class="filter-group-title">Fachrichtung &amp; MVZ</span>
          <span class="filter-group-actions">
            <button type="button" id="kategorie-all">alle</button>
            <button type="button" id="kategorie-none">keine</button>
          </span>
        </div>
        <div class="filter-group-body" id="kategorie-body">
          <div id="kategorie-list" class="kategorie-list"></div>
        </div>
      </div>

      <div class="sidebar-section filters groesse-filter">
        <div class="filter-group-label">
          <button type="button" class="chevron-btn" data-target="groesse-body" aria-expanded="true"><span class="chevron"></span></button>
          <span class="filter-group-title">Praxisgröße</span>
        </div>
        <div class="filter-group-body" id="groesse-body">
          <div class="groesse-value">Ab <strong id="groesse-value-label">1</strong> Arzt/Ärzten</div>
          <input type="range" id="groesse-slider" class="groesse-slider" min="0" max="100" step="1" value="0">
        </div>
      </div>

      <div class="sidebar-section list-wrap">
        <ul id="doctor-list" class="doctor-list"></ul>
      </div>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>

      <div class="map-controls-extra">
        <button id="rotate-toggle" class="pill-btn" title="Automatische Rotation ein/aus">
          <span id="rotate-icon">⏸</span> Rotation
        </button>
      </div>

      <div class="legend">
        <div class="legend-title">Farbe = Fachrichtung</div>
        <div class="legend-hint">Alle Kategorien &amp; Farben in der Seitenleiste</div>
      </div>
    </main>
  </div>

  <script src="vendor/maplibre-gl/maplibre-gl.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
